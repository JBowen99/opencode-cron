services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      CRON_TOKEN: ${CRON_TOKEN:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      DATA_DIR: /data
      SANDBOX_URL: http://sandbox:8788
      PORT: "8787"
      HOST: 0.0.0.0
    volumes:
      - cron-data:/data
    expose:
      - "8787"
    depends_on:
      sandbox:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      PORT: "8788"
      HOST: 0.0.0.0
      WORKSPACE_ROOT: /workspaces
    volumes:
      - cron-workspaces:/workspaces
    expose:
      - "8788"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  cron-data:
  cron-workspaces:
